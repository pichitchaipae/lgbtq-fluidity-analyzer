apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: lgbtq-analysis
  labels:
    app: lgbtq-frontend
    tier: web
    version: v1
spec:
  replicas: 2 # 2 replicas for load balancing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero downtime deployment
  selector:
    matchLabels:
      app: lgbtq-frontend
  template:
    metadata:
      labels:
        app: lgbtq-frontend
        tier: web
        version: v1
    spec:
      containers:
      - name: frontend
        image: lgbtqsexualfluidityanalysistool-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: frontend-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: lgbtq-analysis
  labels:
    app: lgbtq-frontend
spec:
  type: LoadBalancer # Change to NodePort or ClusterIP if needed
  selector:
    app: lgbtq-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
    # nodePort: 30080  # Uncomment for NodePort
  sessionAffinity: None
