apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: lgbtq-analysis
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  # No database - in-memory processing only for privacy
  DATA_RETENTION: "none"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: lgbtq-analysis
data:
  VITE_API_URL: "http://backend-service:8000"
  NGINX_WORKER_PROCESSES: "auto"
  NGINX_WORKER_CONNECTIONS: "1024"
