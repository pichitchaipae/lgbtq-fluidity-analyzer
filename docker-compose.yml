services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgbtq-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - lgbtq-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lgbtq-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - lgbtq-network

  # Cypress E2E Testing Service
  # Note: This service only runs during testing, not in production
  cypress:
    image: cypress/included:13.6.0
    container_name: lgbtq-cypress
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - CYPRESS_baseUrl=http://frontend:80
      - CYPRESS_API_URL=http://backend:8000
    working_dir: /e2e
    volumes:
      - ./cypress.config.js:/e2e/cypress.config.js
      - ./cypress:/e2e/cypress
    networks:
      - lgbtq-network
    profiles:
      - test  # Only run when explicitly called with --profile test

networks:
  lgbtq-network:
    driver: bridge
    name: lgbtq-network

# Volume definitions for data persistence (if needed in future)
volumes:
  cypress-videos:
  cypress-screenshots:
