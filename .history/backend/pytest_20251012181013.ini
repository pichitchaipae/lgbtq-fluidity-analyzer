[pytest]
# Pytest configuration for LGBTQ+ Fluidity Analysis Tool
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest-asyncio configuration
asyncio_default_fixture_loop_scope = function

# Show warnings summary
filterwarnings =
    # Ignore statsmodels warnings from test data (expected with synthetic data)
    ignore::RuntimeWarning:statsmodels
    ignore::scipy.stats._warnings_errors.UserWarning
    # Ignore Pydantic V1 deprecation warnings (planned migration to V2)
    ignore::pydantic.PydanticDeprecatedSince20
